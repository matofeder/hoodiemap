# Local services: Overpass API for Slovakia (docs/local-overpass.md) and Postgres for presentations.
services:
  postgres:
    image: postgres:16.4-bookworm
    container_name: hoodiemap-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hoodiemap
      POSTGRES_PASSWORD: hoodiemap   # local development only; production sets HOODIEMAP_DATABASE_URL
      POSTGRES_DB: hoodiemap
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    restart: unless-stopped

  overpass:
    # pinned: the image we imported and tested with (Overpass API 0.7.62.11, amd64+arm64 index)
    image: wiktorn/overpass-api:latest@sha256:9bb5f4a9b54cd225bf828c04c67e7f4010650ff4d70b72157a9473a9ba02d93c
    container_name: hoodiemap-overpass
    ports:
      - "12345:80"
    volumes:
      - overpass-db:/db
    environment:
      OVERPASS_MODE: init
      OVERPASS_META: "no"
      OVERPASS_PLANET_URL: https://download.geofabrik.de/europe/slovakia-latest.osm.pbf
      OVERPASS_DIFF_URL: https://download.geofabrik.de/europe/slovakia-updates/
      # the image imports .osm.bz2; convert the Geofabrik .pbf first.
      # chmod: a fresh /db volume is 0700 (overpass home), so the nginx/fcgiwrap user
      # cannot reach the dispatcher socket ("Permission denied ... osm3s_osm_base").
      OVERPASS_PLANET_PREPROCESS: >-
        mv /db/planet.osm.bz2 /db/planet.osm.pbf &&
        osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf &&
        rm /db/planet.osm.pbf &&
        chmod 755 /db
      OVERPASS_COMPRESSION: gz
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_UPDATE_SLEEP: "3600"
      OVERPASS_USE_AREAS: "false"
      OVERPASS_MAX_TIMEOUT: "120s"
    restart: unless-stopped

volumes:
  overpass-db:
  postgres-db:
