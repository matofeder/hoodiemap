<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neighbourhood Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #E8EDF2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Loading ─────────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: #E8EDF2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1E2D3D;
      font-size: 14px;
      z-index: 100;
    }

    /* ── Infographic shell ───────────────────────────────── */
    #app { width: 1340px; }

    .infographic-root {
      width: 1340px;
      background: #F5F7FA;
      border: 1px solid rgba(0, 0, 0, 0.10);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
    }

    /* ── Header ─────────────────────────────────────────── */
    .infographic-header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.7);
    }
    .infographic-title {
      color: #1E2D3D;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .infographic-address {
      color: #6B7A8D;
      font-size: 11px;
    }

    /* ── Body: 3 columns ─────────────────────────────────── */
    .infographic-body {
      display: flex;
      height: 676px;
    }

    /* ── Panels ──────────────────────────────────────────── */
    .infographic-panel {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 10px;
      background: #FFFFFF;
    }
    .infographic-panel-left {
      border-right: 1px solid rgba(0, 0, 0, 0.07);
    }
    .infographic-panel-right {
      border-left: 1px solid rgba(0, 0, 0, 0.07);
    }

    /* ── POI cards ───────────────────────────────────────── */
    .poi-card {
      background: #F0F4F8;
      border-left: 3px solid var(--cat-color, #888);
      border-radius: 0 5px 5px 0;
      padding: 8px 10px;
    }
    .poi-card-emoji-name {
      font-size: 11px;
      font-weight: 600;
      color: #1E2D3D;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .poi-card-meta {
      font-size: 10px;
      color: #6B7A8D;
      margin-bottom: 6px;
    }
    .poi-card-bar-track {
      height: 3px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .poi-card-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--cat-color, #888);
      transition: width 0.8s ease;
    }

    /* ── 3D canvas slot ──────────────────────────────────── */
    .infographic-canvas-slot {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #F0F4F8;
    }
    .infographic-canvas-slot canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Transport strip ─────────────────────────────────── */
    .infographic-strip {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border-top: 1px solid rgba(0, 0, 0, 0.07);
      background: #F8FAFC;
      overflow-x: auto;
    }
    .infographic-strip::-webkit-scrollbar { display: none; }
    .transport-pill {
      flex-shrink: 0;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 12px;
      padding: 3px 11px;
      font-size: 10px;
      color: #4A5568;
      white-space: nowrap;
    }

    /* ── Outer POI indicators (from frame.js) ────────────── */
    .outer-poi-indicator {
      position: absolute;
      pointer-events: auto;
      cursor: default;
      z-index: 10;
    }
    .outer-poi-pill {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      padding: 3px 8px;
      font-size: 9px;
      color: #1E2D3D;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    .outer-poi-header {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 1px;
    }
    .outer-poi-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .outer-poi-name { font-weight: 600; }
    .outer-poi-meta { color: #6B7A8D; font-size: 8px; }
    .outer-poi-indicator.active .outer-poi-pill {
      border-color: rgba(0, 0, 0, 0.25);
      background: rgba(255, 255, 255, 0.98);
    }

    /* ── Scale down on small screens ────────────────────── */
    @media (max-width: 1400px) {
      body { align-items: flex-start; padding: 16px; }
      #app {
        transform-origin: top left;
        transform: scale(0.75);
      }
    }
  </style>
</head>
<body>
  <div id="loading">Načítavam mapu…</div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
